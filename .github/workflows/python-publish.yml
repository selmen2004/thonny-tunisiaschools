# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

# Le declencheur `push:` est retire : il faisait partir cette chaine a chaque
# pousssee, y compris sur les branches de travail, et sa derniere etape publie
# sur PyPI. Un push ne doit donc plus pouvoir déposer une version. La publication
# reste attachee a l'evenement qui la decide vraiment — la sortie d'une release.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:

    runs-on: ubuntu-latest
    environment: pypi

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build 
    - name: Build package
      run: python -m build --outdir dist/
    - uses: actions/upload-artifact@v4
      with:
        path: |
          dist/*.tar.gz
          dist/*.whl

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
